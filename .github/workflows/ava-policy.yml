name: AVA Policy Guard

on:
  pull_request:
    paths:
      - "ava/**"
      - "tests/test_ava_policy_acceptance.py"
      - "pytest.ini"
      - ".github/workflows/ava-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest tests/test_ava_policy_acceptance.py
