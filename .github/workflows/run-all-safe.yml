name: Run All Safe Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-all-safe.yml'

permissions:
  contents: read

jobs:
  static-safe-audit:
    name: Inventory, hash, and static parse
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Inventory tracked files and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ava-run-all-safe'
          out.mkdir(parents=True, exist_ok=True)

          raw_paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          inventory = []
          failures = []

          for raw_path in raw_paths:
              if not raw_path:
                  continue

              relative_path = raw_path.decode('utf-8', errors='surrogateescape')
              path = pathlib.Path(relative_path)
              source = 'worktree'

              try:
                  data = path.read_bytes()
              except (FileNotFoundError, IsADirectoryError, OSError):
                  source = 'git-object'
                  try:
                      data = subprocess.check_output(['git', 'show', f'HEAD:{relative_path}'])
                  except subprocess.CalledProcessError as exc:
                      failures.append({
                          'path': relative_path,
                          'error': f'unable to read tracked file from worktree or git object (exit {exc.returncode})'
                      })
                      continue

              inventory.append({
                  'path': relative_path,
                  'size_bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'source': source,
              })

          (out / 'inventory.sha256.json').write_text(
              json.dumps(inventory, indent=2, ensure_ascii=False),
              encoding='utf-8'
          )

          if failures:
              (out / 'inventory.failures.json').write_text(
                  json.dumps(failures, indent=2, ensure_ascii=False),
                  encoding='utf-8'
              )
              raise SystemExit(f'[AVA][STOP] {len(failures)} tracked file(s) could not be hashed.')

          fallback_count = sum(1 for item in inventory if item['source'] == 'git-object')
          print(f'[AVA] inventoried and hashed {len(inventory)} tracked files; git-object fallback used for {fallback_count}.')
          PY

      - name: Statically parse every PowerShell file
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $Out = Join-Path $env:RUNNER_TEMP 'ava-run-all-safe'
          $Results = [System.Collections.Generic.List[object]]::new()
          $HasErrors = $false

          $PowerShellFiles = @(
            Get-ChildItem -LiteralPath $PWD -Recurse -File -Filter '*.ps1' |
              Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' } |
              Sort-Object FullName
          )

          foreach ($File in $PowerShellFiles) {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $File.FullName,
              [ref]$Tokens,
              [ref]$Errors
            ) | Out-Null

            $Parsed = (@($Errors).Count -eq 0)
            if (-not $Parsed) { $HasErrors = $true }

            $Results.Add([pscustomobject]@{
              path = [IO.Path]::GetRelativePath($PWD.Path, $File.FullName)
              parsed = $Parsed
              errors = @($Errors | ForEach-Object { $_.Message })
            })
          }

          $Results |
            ConvertTo-Json -Depth 6 |
            Set-Content -LiteralPath (Join-Path $Out 'powershell-parse-results.json') -Encoding UTF8

          if ($HasErrors) {
            throw 'Static PowerShell parsing found syntax errors.'
          }

          Write-Host "[AVA] statically parsed $($Results.Count) PowerShell files without executing them."

      - name: Verify repository was not modified
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          echo '[AVA][PASS] repository remained unchanged.'

      - name: Upload safe-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ava-run-all-safe-${{ github.run_id }}
          path: ${{ runner.temp }}/ava-run-all-safe
          if-no-files-found: warn
          retention-days: 14

# Safe trigger marker: inventory-git-object-fallback-2026-08-13
